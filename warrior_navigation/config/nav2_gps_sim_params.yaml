# Warrior GPS simulation: map from gps_sim.launch.py, local motion in odom.
# No static map. Unobserved global cells may be planned through;
# /navigation/scan marks height-filtered lidar obstacles and the local
# controller checks collisions. The raw multi-ring /scan includes ground returns.
# lane_layer (warrior_costmap_plugins/LaneLayer) turns white lane-line paint
# from warrior_lane_detection into the highest passable cost (252) out to the
# robot's half-width. pothole_layer, a second LaneLayer on the potholes that
# lane_segmentation splits off by shape, costs only 120, so the planner
# always drives over a pothole rather than cross a line. lethal: true makes
# lines a hard wall, but the robot then gets stuck (planning fails as soon as
# its centre is inside the band) - see warrior_costmap_plugins/README.md. Lidar never
# clears it; only the camera's own visible-ground cloud does. With no camera
# running the layer stays empty and changes nothing.
#
# Footprint = the real body + swerve plates (convex hull of the meshes in
# warrior_description, base_footprint frame): 1.12 m long, 1.29 m wide. The
# old 0.75 m circle (1.5 m wide) could not fit the 1.47 m between a centred
# IGVC pothole and the lane line. Resolution 0.05 m: that gap leaves ~9 cm
# per side, below a 0.1 m cell.
# Keep waypoint intermediate_goal_distance (20 m) below half this 80 m window
# minus footprint/inflation margin. Larger missions use successive local goals.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/local
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /odometry/local
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.30

    FollowPath:
      # Use the swerve base as a conventional forward/yaw mobile base for
      # predictable field navigation. Holonomic MPPI remains a future tuning
      # option, but its free lateral/reverse motion was unreliable in Humble.
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # 0.7 m/s: above the IGVC 1 mph (0.447 m/s) minimum-speed check with
      # margin, below the swerve controller's 1.0 m/s limit. velocity_smoother
      # max_velocity[0] must stay >= this or it silently caps the speed.
      desired_linear_vel: 0.70
      lookahead_dist: 0.80
      min_lookahead_dist: 0.40
      max_lookahead_dist: 1.20
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.8
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.60
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.10
      use_rotate_to_heading: true
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      footprint: "[[0.69, 0.13], [-0.23, 0.66], [-0.46, 0.53], [-0.46, -0.53], [-0.23, -0.66], [0.69, -0.13]]"
      footprint_padding: 0.01
      track_unknown_space: false
      plugins: [obstacle_layer, lane_layer, pothole_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /navigation/scan
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 14.0
          obstacle_min_range: 0.1
          max_obstacle_height: 2.0
          inf_is_valid: true
      lane_layer:
        # Lane lines (warrior_costmap_plugins/LaneLayer): lane_cost 252, the
        # highest passable cost, out to keepout_radius (footprint half-width
        # 0.66 m), then 0 over falloff_radius to keep the robot centred.
        # Clears only ground the camera saw.
        plugin: warrior_costmap_plugins::LaneLayer
        enabled: true
        mark_topic: /perception/lane_points
        clear_topic: /perception/lane_free_points
        lethal: false
        keepout_radius: 0.66
        lane_cost: 252
        falloff_radius: 0.5
        clear_resolution: 0.2  # = lane_segmentation free_resolution
      pothole_layer:
        # Potholes: avoided when there is room, driven over rather than
        # crossing a line (cost 120 < the lines' 252). A centred IGVC pothole
        # leaves 1.47 m to the line for a 1.29 m robot.
        plugin: warrior_costmap_plugins::LaneLayer
        enabled: true
        mark_topic: /perception/pothole_points
        clear_topic: /perception/lane_free_points
        lethal: false
        keepout_radius: 0.6
        lane_cost: 120
        falloff_radius: 0.3
        clear_resolution: 0.2
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.9
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: true
      width: 80
      height: 80
      resolution: 0.05
      footprint: "[[0.69, 0.13], [-0.23, 0.66], [-0.46, 0.53], [-0.46, -0.53], [-0.23, -0.66], [0.69, -0.13]]"
      footprint_padding: 0.01
      track_unknown_space: true
      plugins: [obstacle_layer, lane_layer, pothole_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /navigation/scan
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 14.0
          obstacle_min_range: 0.1
          max_obstacle_height: 2.0
          inf_is_valid: true
      lane_layer:
        # Lane lines (warrior_costmap_plugins/LaneLayer): lane_cost 252, the
        # highest passable cost, out to keepout_radius (footprint half-width
        # 0.66 m), then 0 over falloff_radius to keep the robot centred.
        # Clears only ground the camera saw.
        plugin: warrior_costmap_plugins::LaneLayer
        enabled: true
        mark_topic: /perception/lane_points
        clear_topic: /perception/lane_free_points
        lethal: false
        keepout_radius: 0.66
        lane_cost: 252
        falloff_radius: 0.5
        clear_resolution: 0.2  # = lane_segmentation free_resolution
      pothole_layer:
        # Potholes: avoided when there is room, driven over rather than
        # crossing a line (cost 120 < the lines' 252). A centred IGVC pothole
        # leaves 1.47 m to the line for a 1.29 m robot.
        plugin: warrior_costmap_plugins::LaneLayer
        enabled: true
        mark_topic: /perception/pothole_points
        clear_topic: /perception/lane_free_points
        lethal: false
        keepout_radius: 0.6
        lane_cost: 120
        falloff_radius: 0.3
        clear_resolution: 0.2
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.9
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.5
      allow_unknown: true
      # Weighs the lane cost: a line (252 over ~1.4 m) costs several metres
      # of detour more than a pothole (120), so potholes are driven over first.
      cost_travel_multiplier: 4.0

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.80, 0.50, 1.50]  # x above RPP desired_linear_vel (0.70)
    min_velocity: [-0.35, -0.50, -1.50]
    max_accel: [1.0, 1.0, 2.0]
    max_decel: [-2.0, -2.0, -3.0]
    odom_topic: /odometry/local
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.25
