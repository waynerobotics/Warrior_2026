# MTi-680G GNSS/INS localization for the Warrior simulators. The controller must
# have enable_odom_tf=false: only ekf_node_odom publishes odom -> base_footprint.
# /odom_gt is deliberately excluded from both filters.
# gps_sim.launch.py uses odom0 as the wheel slot. use_wheel_odometry:=false
# removes it, renumbers remaining GPS inputs, and adds /gnss/velocity_body.
ekf_node_odom:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Fuse wheel velocities, not their integrated pose as a second measurement.
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # The local frame starts at the robot and remains continuous through GPS
    # corrections; absolute ENU heading belongs to the global filter below.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false

ekf_node_map:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # navsat_transform handles the GPS antenna's offset through the robot TF.
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false

navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0
    # Gazebo publishes ENU heading (0=east) using the world spherical datum.
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    # Humble's installed local-Cartesian path throws an MGRS exception during
    # initialization. UTM conversion includes meridian convergence internally;
    # /fromLL still returns the EKF's ENU-aligned map coordinates.
    use_local_cartesian: false
    broadcast_cartesian_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false

gnss_velocity_to_body:
  ros__parameters:
    antenna_frame: gnss_antenna_frame
    enu_frame: gnss_enu
    max_imu_age: 0.2
    max_velocity_age: 0.5
