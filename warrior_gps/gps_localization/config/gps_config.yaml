# GPS Localization Configuration
gps_localization:
  apriltag_gps_bridge:
    ros__parameters:
      robot_name: shanti
      camera_params: [514.8914923, 515.01073552, 320.13602236, 240.43150943]

  gps_hardware_node:
    ros__parameters:
      port: /dev/ttyUSB0      # GT-U7 default USB port
      baudrate: 9600          # GT-U7 default baud rate
      timeout: 1.0

  world_gps_node:
    ros__parameters:
      use_hardware_gps: true  # Set to true for outdoor with GT-U7
      fixed_latitude: 42.355813766840626
      fixed_longitude: -83.07073585365939
      fixed_altitude: 200.0

  waypoint_navigator:
    ros__parameters:
      robot_name: shanti
      utm_zone: 17             # Detroit area
      waypoint_tolerance: 0.3  # meters

      # COMPETITION WAYPOINTS
      waypoint_1_lat: 42.3558190240252
      waypoint_1_lon: -83.07073781236565

      waypoint_2_lat: 42.35583925693282
      waypoint_2_lon: -83.07074129876963

      waypoint_3_lat: 42.35583038925074
      waypoint_3_lon: -83.07071348530908

      waypoint_4_lat: 42.35582092838962
      waypoint_4_lon: -83.070709925549

  robot_frame_node:
    ros__parameters:
      robot_name: shanti
      initial_x: 0.0
      initial_y: 0.0
      initial_z: 0.0