# cares_gps_config.yaml
gps_localization:
  apriltag_gps_bridge:
    ros__parameters:
      robot_name: warrior_1
      camera_parameters: [514.8914923, 515.01073552, 320.13602236,]

  world_gps_node:
    ros__parameters:
      use_hardware_gps: true  # Always false for indoor
      fixed_latitude: 42.3558128
      fixed_longitude: -83.0707164
      fixed_altitude: 200.0

  waypoint_navigator_node:
    ros__parameters:
      robot_name: warrior_1
      utm_zone: 17
      waypoint_tolerance: 0.3

  robot_frame_node:
    ros__parameters:
      robot_name: warrior_1
      initial_x: 0.0
      initial_y: 0.0
      initial_z: 0.0