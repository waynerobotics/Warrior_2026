# GPS Localization Configuration
gps_localization:
  apriltag_gps_bridge:
    ros__parameters:
      robot_name: shanti
      camera_params: [514.8914923, 515.01073552, 320.13602236, 240.43150943]

  gps_hardware_node:
    ros__parameters:
      port: /dev/ttyUSB0      # GT-U7 default USB port
      baudrate: 9600          # GT-U7 default baud rate
      timeout: 1.0

  world_gps_node:
    ros__parameters:
      use_hardware_gps: true  # Set to true for outdoor with GT-U7
      fixed_latitude: 42.303943
      fixed_longitude: -83.073173
      fixed_altitude: 200.0

  waypoint_navigator:
    ros__parameters:
      robot_name: shanti
      utm_zone: 17             # Detroit area
      waypoint_tolerance: 0.3  # meters

      # COMPETITION WAYPOINTS
      waypoint_1_lat: 42.363953
      waypoint_1_lon: -83.073156

      waypoint_2_lat: 42.363958
      waypoint_2_lon: -83.073174

      waypoint_3_lat: 42.363935
      waypoint_3_lon: -83.073179

      waypoint_4_lat: 42.363932
      waypoint_4_lon: -83.073160

  robot_frame_node:
    ros__parameters:
      robot_name: shanti
      initial_x: 0.0
      initial_y: 0.0
      initial_z: 0.0