# gz topic published by the simulator core
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# lidar scan
- ros_topic_name: "scan"
  gz_topic_name: "L1_lidar/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# lidar points
- ros_topic_name: "unilidar/cloud"
  gz_topic_name: "L1_lidar/scan/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# MTi-680G IMU and NavSat are handled by warrior_mti680g_sim, which preserves
# GNSS velocity and supplies measurement covariance on the public ROS topics.

# odom
- ros_topic_name: "odom_gt"
  gz_topic_name: "odom_gt"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
